[project]
name = "careerpilot-backend"
version = "0.1.0"
description = "CareerPilot India FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "PyJWT>=2.9",
    "pypdf>=5",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "nh3>=0.2",
    "psycopg[binary]>=3.2",
    "sentry-sdk>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends()/File()/Query() in argument defaults is the standard FastAPI idiom.
"app/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]